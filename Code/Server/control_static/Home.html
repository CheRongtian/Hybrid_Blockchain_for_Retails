<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supply Chain Control</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <main class="layout">
        <section id="login-card" class="auth-card">
            <p class="eyebrow">SUPPLY CHAIN · CONTROL IDENTITY</p>
            <h1>Control Panel Login</h1>
            <p>Only administrator accounts can read supply-chain verification records.</p>
            <form id="login-form">
                <label>
                    Administrator Username
                    <input name="username" placeholder="admin01" autocomplete="username" required>
                </label>
                <label>
                    Password
                    <input name="password" type="password" autocomplete="current-password" required>
                </label>
                <label class="remember-login">
                    <input id="remember-login" name="remember" value="true" type="checkbox">
                    <span>Remember me on this device</span>
                </label>
                <button type="submit">Log In to Control Panel</button>
            </form>
            <p id="login-status" class="status" aria-live="polite"></p>
        </section>

        <section id="dashboard" hidden>
            <header class="page-header">
                <div>
                    <p class="eyebrow">SUPPLY CHAIN · CONTROL</p>
                    <h1>Supply Chain Verification Control Panel</h1>
                    <p id="identity-status"></p>
                </div>
                <div class="header-actions">
                    <button id="refresh-button" type="button">Refresh Records</button>
                    <button id="logout-button" type="button">Log Out</button>
                </div>
            </header>

            <section class="record-card workflow-card" aria-labelledby="workflow-title">
                <header>
                    <div>
                        <p class="eyebrow">PRESET WORKFLOW</p>
                        <h2 id="workflow-title">Supply Chain Route</h2>
                    </div>
                    <span class="badge pending">Fixed route</span>
                </header>
                <canvas id="workflow-canvas" aria-label="Preset supply chain route"></canvas>
                <p id="workflow-status" class="status" aria-live="polite">Loading preset route...</p>
            </section>

            <p id="load-status" class="status" aria-live="polite">Loading supply-chain workflow...</p>
            <section id="record-list" class="record-list" aria-label="Supply-chain records"></section>
        </section>
    </main>

    <script src="/js/main.js" defer></script>
</body>
</html>
