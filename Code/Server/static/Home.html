<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supply Chain Merkle Verification</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <main class="layout">
        <section class="card">
            <p class="eyebrow">SUPPLY CHAIN · MERKLE TREE</p>
            <h1>供应链信息确认</h1>
            <p class="intro">确认后，Server 会把这条记录加入内存 Merkle Tree，并立即生成和验证 Proof。</p>

            <form id="record-form">
                <label>
                    批次号
                    <input name="batchId" placeholder="BATCH-001" maxlength="256" required>
                </label>
                <label>
                    产品名称
                    <input name="product" placeholder="Strawberries" maxlength="256" required>
                </label>
                <label>
                    产地
                    <input name="origin" placeholder="Missouri" maxlength="256" required>
                </label>
                <label>
                    当前阶段
                    <input name="stage" placeholder="Received" maxlength="256" required>
                </label>
                <label>
                    确认人
                    <input name="confirmedBy" placeholder="Alice" maxlength="256" required>
                </label>

                <label class="confirmation">
                    <input id="confirmed" name="confirmed" type="checkbox" value="true" required>
                    <span>我已检查并确认以上信息无误</span>
                </label>

                <button type="submit">确认并生成 Merkle Block</button>
            </form>

            <p id="request-status" class="request-status" aria-live="polite"></p>
        </section>

        <section id="result-card" class="card result-card" hidden>
            <p class="eyebrow">VERIFICATION RESULT</p>
            <h2 id="verification-title">Verified</h2>
            <dl>
                <div>
                    <dt>Block ID</dt>
                    <dd id="block-id"></dd>
                </div>
                <div>
                    <dt>Merkle Root</dt>
                    <dd><code id="root-hash"></code></dd>
                </div>
                <div>
                    <dt>Proof</dt>
                    <dd><code id="proof"></code></dd>
                </div>
            </dl>
        </section>
    </main>

    <script src="/js/main.js" defer></script>
</body>
</html>
