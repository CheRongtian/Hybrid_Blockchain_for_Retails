name: blockchain-structure

services:
  ipfs:
    image: ipfs/kubo:v0.43.0
    restart: unless-stopped
    volumes:
      - ipfs-data:/data/ipfs
    healthcheck:
      test: ["CMD-SHELL", "ipfs id >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20

  hardhat:
    image: blockchain-structure-public:local
    build:
      context: .
      dockerfile: docker/public.Dockerfile
    command:
      - npm
      - run
      - node
      - --
      - --hostname
      - 0.0.0.0
      - --chain-id
      - "31337"
    restart: unless-stopped
    ports:
      - "127.0.0.1:8545:8545"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:8545',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',method:'eth_chainId',params:[],id:1})}).then(response=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 3s
      timeout: 3s
      retries: 30

  deploy:
    image: blockchain-structure-public:local
    build:
      context: .
      dockerfile: docker/public.Dockerfile
    command: ["node", "scripts/docker_ensure_deployment.mjs"]
    restart: "no"
    environment:
      PUBLIC_CHAIN_ID: "31337"
      PUBLIC_CHAIN_RPC_URL: http://hardhat:8545
    volumes:
      - public-deployments:/app/Code/PublicChain/deployments
    depends_on:
      hardhat:
        condition: service_healthy

  control:
    image: blockchain-structure-private:local
    build:
      context: .
      dockerfile: docker/private.Dockerfile
    command: ["/app/bin/control_server", "8081", "/app/control_static"]
    restart: unless-stopped
    environment:
      SERVER_HOST: 0.0.0.0
      SUPPLY_CHAIN_STORAGE_ROOT: /app/Storage
      IPFS_API_URL: http://ipfs:5001
      PUBLIC_CHAIN_SERVICE_URL: http://consumer:8082
      PUBLIC_CHAIN_PUBLICATION_TOKEN: local-publication-demo-token
    ports:
      - "8081:8081"
    volumes:
      - ./Storage:/app/Storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8081'"]
      interval: 3s
      timeout: 3s
      retries: 30
    depends_on:
      ipfs:
        condition: service_healthy

  participant:
    image: blockchain-structure-private:local
    build:
      context: .
      dockerfile: docker/private.Dockerfile
    command: ["/app/bin/user_server", "8080", "/app/user_static"]
    restart: unless-stopped
    environment:
      SERVER_HOST: 0.0.0.0
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 3s
      timeout: 3s
      retries: 30
    depends_on:
      control:
        condition: service_healthy

  consumer:
    image: blockchain-structure-public:local
    build:
      context: .
      dockerfile: docker/public.Dockerfile
    command: ["npm", "run", "consumer"]
    restart: unless-stopped
    env_file:
      - ./Code/PublicChain/.env
      - ./docker/docker.env
    environment:
      CONSUMER_HOST: 0.0.0.0
      CONSUMER_PORT: "8082"
      PRIVATE_CONTROL_SERVER_URL: http://control:8081
      PUBLIC_CHAIN_ID: "31337"
      PUBLIC_CHAIN_RPC_URL: http://hardhat:8545
      PUBLIC_CHAIN_PUBLICATION_TOKEN: local-publication-demo-token
      SUPPLY_CHAIN_STORAGE_ROOT: /app/Storage
      QR_GENERATOR_BINARY: /usr/local/bin/snapshot_qr
    ports:
      - "8082:8082"
    volumes:
      - ./Storage:/app/Storage
      - public-deployments:/app/Code/PublicChain/deployments
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:8082/api/status').then(response=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 3s
      timeout: 3s
      retries: 30
    depends_on:
      control:
        condition: service_healthy
      deploy:
        condition: service_completed_successfully

  qr-display:
    image: blockchain-structure-public:local
    build:
      context: .
      dockerfile: docker/public.Dockerfile
    command: ["npm", "run", "qr-display"]
    restart: unless-stopped
    environment:
      QR_DISPLAY_HOST: 0.0.0.0
      QR_DISPLAY_PORT: "8084"
      CONSUMER_INTERNAL_URL: http://consumer:8082
    ports:
      - "8084:8084"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:8084/api/status').then(response=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 3s
      timeout: 3s
      retries: 30
    depends_on:
      consumer:
        condition: service_healthy

volumes:
  ipfs-data:
  public-deployments:
